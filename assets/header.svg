    <radialGradient id="b" cx="90%" cy="10%" r="55%"><stop offset="0" stop-color="#4f46e5" stop-opacity=".40"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
